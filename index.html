<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Voyage Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --surface: #121c30;
    --surface-2: #182742;
    --line: #24344f;
    --brass: #c9a86a;
    --brass-bright: #e6c98a;
    --text: #e8ecf4;
    --dim: #93a0b8;
    --faint: #5d6b85;
    --green: #4fc08d;
    --amber: #e0a437;
    --red: #e06565;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; overflow-x: hidden;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  h1,h2,h3,h4,.serif { font-family: 'Marcellus', serif; font-weight: 400; }
  button { font-family: 'Inter', sans-serif; }

  /* ===== Header ===== */
  header {
    padding: calc(16px + env(safe-area-inset-top)) 20px 12px;
    background: linear-gradient(180deg, #0e1830, var(--bg));
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand-mark {
    width: 36px; height: 36px; border: 1px solid var(--brass); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--brass); font-family: 'Marcellus', serif; font-size: 17px; flex-shrink: 0;
  }
  .brand h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
  .brand p { font-size: 10px; color: var(--brass); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 1px; }
  .hdr-action {
    margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--dim);
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 9px 13px; border-radius: 9px; min-height: 44px; cursor: pointer; flex-shrink: 0;
  }

  .progress-wrap { margin-top: 13px; }
  .progress-bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 2px; background: linear-gradient(90deg, var(--brass), var(--brass-bright)); transition: width .3s ease; }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
  .progress-meta .stage { color: var(--brass); }

  main { padding: 20px 16px 0; max-width: 640px; margin: 0 auto; }

  /* ===== Shared bits ===== */
  .q-eyebrow { font-size: 10.5px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--brass); margin-bottom: 9px; }
  .q-title { font-size: 25px; line-height: 1.25; }
  .q-help { font-size: 13.5px; color: var(--dim); margin-top: 9px; line-height: 1.55; }
  .q-body { margin-top: 22px; }
  .part-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--brass); margin: 26px 2px 9px; display: flex; align-items: center; gap: 9px; }
  .part-label.first { margin-top: 4px; }
  .part-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .part-help { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: -3px 2px 11px; }
  .sec-head { font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--dim); margin: 26px 4px 10px; display: flex; align-items: center; gap: 9px; }
  .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    min-height: 56px; padding: 13px 16px; border-radius: 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 15px;
  }
  .opt .o-ico { font-size: 19px; width: 24px; text-align: center; flex-shrink: 0; }
  .opt .o-main { flex: 1; min-width: 0; }
  .opt .o-label { font-weight: 600; display: block; }
  .opt .o-sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; display: block; }
  .opt .o-mark { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--bg); }
  .opt.sel { border-color: var(--brass); background: rgba(201,168,106,.09); }
  .opt.sel .o-mark { background: var(--brass); border-color: var(--brass); }
  .opt.sel .o-mark::after { content: '✓'; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field .lbl { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; display: block; }
  input[type=text], input[type=date], input[type=number], input[type=password], textarea, select {
    width: 100%; min-height: 50px; padding: 13px 14px; border-radius: 11px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 16px;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brass); }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  .tier-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding-left: 37px; }
  .tier-row select { min-height: 44px; font-size: 14px; padding: 8px 12px; }

  .note { margin-top: 16px; padding: 12px 14px; border-radius: 11px; font-size: 13px; line-height: 1.55; background: rgba(224,164,55,.07); border: 1px solid rgba(224,164,55,.28); color: var(--dim); }
  .note b { color: var(--brass-bright); font-weight: 600; }

  /* ===== Footer nav / actions ===== */
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(11,18,32,.97); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .footer .inner { display: flex; gap: 10px; max-width: 640px; margin: 0 auto; width: 100%; }
  .btn { min-height: 52px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); }
  .btn-back { background: transparent; color: var(--dim); padding: 0 20px; }
  .btn-next { flex: 1; background: linear-gradient(135deg, var(--brass), var(--brass-bright)); color: #1a1408; border: none; }
  nav.tabs { display: flex; justify-content: space-around; max-width: 640px; margin: 0 auto; }
  .nav-btn {
    background: none; border: none; color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .6px;
    min-width: 76px; min-height: 52px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .nav-btn .ico { font-size: 20px; }
  .nav-btn.active { color: var(--brass-bright); }

  /* ===== Dashboard ===== */
  .empty { text-align: center; padding: 44px 20px; }
  .empty .e-mark { font-size: 46px; margin-bottom: 16px; }
  .empty h2 { font-size: 23px; margin-bottom: 10px; }
  .empty p { font-size: 14px; color: var(--dim); line-height: 1.6; max-width: 380px; margin: 0 auto 22px; }
  .btn-cta {
    min-height: 54px; padding: 0 26px; border-radius: 13px; font-size: 15.5px; font-weight: 600;
    background: linear-gradient(135deg, var(--brass), var(--brass-bright)); color: #1a1408; border: none; cursor: pointer;
  }
  .trip-tile {
    width: 100%; text-align: left; display: block; cursor: pointer;
    background: linear-gradient(135deg, var(--surface-2), var(--surface) 70%);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 11px; position: relative; overflow: hidden; color: var(--text);
  }
  .trip-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .tt-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .tt-name { font-family: 'Marcellus', serif; font-size: 19px; line-height: 1.2; }
  .tt-sub { font-size: 12.5px; color: var(--dim); margin-top: 5px; }
  .tt-count { text-align: center; flex-shrink: 0; }
  .tt-count .num { font-family: 'Marcellus', serif; font-size: 25px; color: var(--brass-bright); line-height: 1; }
  .tt-count .lbl { font-size: 9px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dim); margin-top: 3px; }
  .tt-next { margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: rgba(224,164,55,.08); border: 1px solid rgba(224,164,55,.28); font-size: 12.5px; color: var(--dim); line-height: 1.45; }
  .tt-next b { color: var(--brass-bright); font-weight: 600; }
  .tt-draft { display: inline-block; margin-top: 10px; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; padding: 4px 9px; border-radius: 5px; color: var(--amber); border: 1px solid rgba(224,164,55,.4); }

  /* ===== Plan ===== */
  .plan-hero { background: linear-gradient(135deg, var(--surface-2), var(--surface) 70%); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; position: relative; overflow: hidden; margin-bottom: 6px; }
  .plan-hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
  .plan-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .plan-name { font-size: 22px; line-height: 1.2; }
  .plan-sub { font-size: 13px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  .plan-count { text-align: center; flex-shrink: 0; }
  .plan-count .num { font-family: 'Marcellus', serif; font-size: 30px; color: var(--brass-bright); line-height: 1; }
  .plan-count .lbl { font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--dim); margin-top: 4px; }
  .plan-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .pchip { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: rgba(201,168,106,.1); border: 1px solid rgba(201,168,106,.35); color: var(--brass-bright); }
  .pchip.warn { background: rgba(224,164,55,.12); border-color: rgba(224,164,55,.45); color: var(--amber); }
  .pchip.ok { background: rgba(79,192,141,.1); border-color: rgba(79,192,141,.4); color: var(--green); }

  .phase-head { display: flex; align-items: center; gap: 10px; margin: 14px 2px 8px; }
  .phase-ico { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; background: rgba(201,168,106,.12); flex-shrink: 0; }
  .phase-head h4 { font-size: 15px; }
  .phase-head .ph-when { font-size: 11.5px; color: var(--dim); margin-left: auto; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 7px; }
  .day .d-date { font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
  .day .d-text { font-size: 13.5px; line-height: 1.55; }
  .day .d-note { font-size: 12.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .day .d-note b { color: var(--brass-bright); font-weight: 600; }

  .ms { display: flex; gap: 12px; align-items: flex-start; padding: 13px 2px; border-bottom: 1px solid var(--line); }
  .ms:last-child { border-bottom: none; }
  .ms-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; border: 2px solid var(--line); background: var(--surface); }
  .ms.critical .ms-dot { background: var(--red); border-color: var(--red); box-shadow: 0 0 11px rgba(224,101,101,.55); }
  .ms.urgent .ms-dot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px rgba(224,164,55,.5); }
  .ms.done .ms-dot { background: var(--green); border-color: var(--green); }
  .ms-body { flex: 1; min-width: 0; }
  .ms-title { font-size: 14.5px; font-weight: 600; }
  .ms.done .ms-title { color: var(--dim); text-decoration: line-through; }
  .ms-when { font-size: 11.5px; font-weight: 700; letter-spacing: .4px; color: var(--brass); margin-top: 3px; }
  .ms.critical .ms-when { color: var(--red); }
  .ms.urgent .ms-when { color: var(--amber); }
  .ms-tip { font-size: 12.5px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  .ms-tag { display: inline-block; margin-top: 7px; margin-right: 6px; font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; color: var(--brass); border: 1px solid rgba(201,168,106,.35); }
  .ms-check { width: 44px; height: 44px; flex-shrink: 0; border-radius: 11px; font-size: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--dim); cursor: pointer; }
  .ms.done .ms-check { color: var(--green); border-color: rgba(79,192,141,.45); }

  .tip-card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--brass); border-radius: 11px; padding: 13px 15px; margin-bottom: 9px; }
  .tip-card h4 { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 700; color: var(--brass-bright); margin-bottom: 5px; }
  .tip-card p { font-size: 13px; color: var(--dim); line-height: 1.55; }
  .tip-card p b { color: var(--text); font-weight: 600; }

  .trade { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 14px 15px; margin-bottom: 11px; }
  .trade h4 { font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
  .trade .t-q { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin-bottom: 12px; }
  .t-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .t-col { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .t-col.pick { border-color: var(--brass); background: rgba(201,168,106,.07); }
  .t-kind { font-size: 9.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 6px; }
  .t-kind.save { color: var(--green); }
  .t-kind.comfort { color: #7cb8ff; }
  .t-opt { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .t-cost { font-size: 12.5px; color: var(--brass-bright); margin-top: 5px; font-weight: 600; }
  .t-why { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.45; }
  .t-rec { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--dim); line-height: 1.5; }
  .t-rec b { color: var(--brass-bright); font-weight: 600; }

  .find { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 9px; }
  .find .f-date { flex-shrink: 0; width: 46px; text-align: center; border-right: 1px solid var(--line); padding-right: 11px; }
  .find .f-date .m { font-size: 9.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--brass); }
  .find .f-date .d { font-family: 'Marcellus', serif; font-size: 20px; line-height: 1.1; }
  .find .f-body { flex: 1; min-width: 0; }
  .find .f-title { font-size: 14px; font-weight: 600; }
  .find .f-meta { font-size: 11.5px; color: var(--brass); margin-top: 3px; }
  .find .f-desc { font-size: 12.5px; color: var(--dim); margin-top: 5px; line-height: 1.5; }

  .cut { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 9px; }
  .cut.on { border-color: var(--brass); background: rgba(201,168,106,.07); }
  .cut-head { display: flex; align-items: center; gap: 10px; }
  .cut-head .c-ico { font-size: 18px; flex-shrink: 0; }
  .cut-head .c-name { font-size: 14.5px; font-weight: 600; flex: 1; }
  .cut-head .c-toggle { min-height: 44px; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: transparent; border: 1px solid var(--brass); color: var(--brass-bright); cursor: pointer; flex-shrink: 0; }
  .cut.on .c-toggle { background: var(--brass); color: #1a1408; border-color: var(--brass); }
  .cut .c-desc { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin-top: 8px; }
  .cut .c-prep { font-size: 12px; color: var(--amber); margin-top: 7px; line-height: 1.45; }

  .seg { display: flex; gap: 9px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; margin-bottom: 9px; }
  .seg .s-num { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: rgba(201,168,106,.16); color: var(--brass-bright); }
  .seg input[type=text] { min-height: 44px; font-size: 15px; padding: 10px 12px; flex: 1; min-width: 0; }
  .seg .nights { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .seg .nights input { width: 56px; min-height: 44px; padding: 10px 4px; text-align: center; font-size: 15px; }
  .seg .nights span { font-size: 11px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .seg .s-del { width: 44px; height: 44px; flex-shrink: 0; background: transparent; border: none; color: var(--faint); font-size: 18px; cursor: pointer; }
  .seg-total { font-size: 12.5px; color: var(--dim); text-align: right; margin-top: 4px; }
  .seg-total b { color: var(--brass-bright); }

  .brief-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .brief-card h3 { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--brass); margin-bottom: 10px; }
  .brief-row { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.04); }
  .brief-row:last-child { border-bottom: none; }
  .brief-row .k { color: var(--dim); flex-shrink: 0; }
  .brief-row .v { text-align: right; font-weight: 500; }
  .brief-empty { color: var(--faint); font-style: italic; }
  .next-steps li { font-size: 13.5px; color: var(--dim); line-height: 1.6; margin-left: 18px; margin-bottom: 7px; }
  .next-steps li b { color: var(--text); font-weight: 600; }

  /* ===== AI panel ===== */
  .ai-panel { background: var(--surface); border: 1px dashed var(--line); border-radius: 13px; padding: 15px; margin-bottom: 10px; }
  .ai-panel h4 { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .ai-panel p { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin-bottom: 12px; }
  .btn-ai { width: 100%; min-height: 48px; border-radius: 11px; font-size: 14.5px; font-weight: 600; background: transparent; border: 1px solid var(--brass); color: var(--brass-bright); cursor: pointer; }
  .btn-ai:disabled { opacity: .5; }
  .ai-badge { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; color: #7cb8ff; border: 1px solid rgba(124,184,255,.4); margin-left: 8px; vertical-align: middle; }

  /* ===== Settings ===== */
  .set-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .set-card h3 { font-size: 17px; margin-bottom: 6px; }
  .set-card p { font-size: 13px; color: var(--dim); line-height: 1.55; margin-bottom: 13px; }
  .set-card p a { color: var(--brass-bright); }
  .btn-row { display: flex; gap: 9px; }
  .btn-sm { min-height: 46px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .btn-sm.primary { background: var(--brass); color: #1a1408; border: none; }
  .btn-sm.danger { color: var(--red); border-color: rgba(224,101,101,.4); }
  .status-line { font-size: 12.5px; margin-top: 10px; }
  .status-line.ok { color: var(--green); }
  .status-line.off { color: var(--dim); }

  /* ===== Modal ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.68); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 22px; max-width: 90vw; width: 350px; max-height: 86vh; overflow-y: auto; }
  .modal-box h3 { font-size: 19px; margin-bottom: 8px; }
  .modal-box p { font-size: 14px; color: var(--dim); line-height: 1.55; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .modal-buttons button { flex: 1; min-height: 48px; border-radius: 11px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); }
  .btn-secondary { background: transparent; color: var(--dim); }
  .btn-primary { background: var(--brass); color: #1a1408; border: none; }
  .btn-danger { background: var(--red); color: #2a0d0d; border: none; }

  /* ===== Toast ===== */
  #toastHost { position: fixed; left: 0; right: 0; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 1100; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
  .toast { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); font-size: 13.5px; padding: 12px 18px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: 100%; }
  .toast.err { border-color: rgba(224,101,101,.5); color: #ffb4b4; }

  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(201,168,106,.3); border-top-color: var(--brass); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header id="appHeader"></header>
<main id="main"></main>
<div class="footer" id="appFooter"></div>
<div id="toastHost"></div>

<script>
(function () {
  'use strict';

  /* =======================================================================
     1. Arizona time helpers  (America/Phoenix, no DST)
     ======================================================================= */
  var AZ = {
    tz: 'America/Phoenix',
    today: function () { return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(new Date()); },
    dateKey: function (d) { return new Intl.DateTimeFormat('en-CA', { timeZone: this.tz }).format(d); },
    pretty: function (s) {
      if (!s) return '';
      var p = s.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    },
    weekday: function (s) {
      if (!s) return '';
      var p = s.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    },
    daysBetween: function (a, b) {
      return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
    },
    addDays: function (s, n) {
      var d = new Date(s + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return this.dateKey(d);
    }
  };

  /* =======================================================================
     2. Storage — namespaced, JSON-safe, never throws
     ======================================================================= */
  var Store = {
    ns: 'voyage_',
    get: function (key, fallback) {
      if (fallback === undefined) fallback = null;
      try {
        var raw = localStorage.getItem(this.ns + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(this.ns + key, JSON.stringify(value)); return true; }
      catch (e) { toast('Could not save — device storage is full.', true); return false; }
    },
    remove: function (key) { try { localStorage.removeItem(this.ns + key); } catch (e) {} }
  };

  /* =======================================================================
     3. Data layer — records with id + updatedAt, deletes are tombstones.
        Solo/localStorage today; the shape is what a future Gist sync needs.
     ======================================================================= */
  var data = Store.get('data', { records: {} });
  if (!data || typeof data !== 'object' || !data.records) data = { records: {} };

  function uid(prefix) {
    return (prefix || 'r') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function saveData() {
    purgeTombstones();
    Store.set('data', data);
  }
  function purgeTombstones() {
    var cutoff = Date.now() - 60 * 86400000;
    Object.keys(data.records).forEach(function (id) {
      var r = data.records[id];
      if (r && r.deleted && (r.updatedAt || 0) < cutoff) delete data.records[id];
    });
  }
  function putRecord(rec) {
    rec.updatedAt = Date.now();
    data.records[rec.id] = rec;
    saveData();
    return rec;
  }
  function softDelete(id) {
    var r = data.records[id];
    if (!r) return;
    data.records[id] = { id: id, type: r.type, deleted: true, updatedAt: Date.now() };
    saveData();
  }
  function liveRecords(type) {
    return Object.keys(data.records)
      .map(function (k) { return data.records[k]; })
      .filter(function (r) { return r && !r.deleted && (!type || r.type === type); });
  }
  function getTrip(id) {
    var r = data.records[id];
    return (r && !r.deleted && r.type === 'trip') ? r : null;
  }

  function newTrip() {
    var t = {
      id: uid('trip'), type: 'trip', status: 'draft',
      answers: {
        travelers: ['Chris', 'Kat', 'Sedona (12)', 'River (9)'],
        memberships: {}, booked: [], segments: [], cuts: []
      },
      ai: {}, createdAt: Date.now()
    };
    return putRecord(t);
  }

  // Milestone completion lives in its own record so it survives plan regeneration
  function msDoneId(tripId, key) { return 'msdone_' + tripId + '_' + key; }
  function isMsDone(tripId, key) {
    var r = data.records[msDoneId(tripId, key)];
    return !!(r && !r.deleted && r.done);
  }
  function setMsDone(tripId, key, done) {
    var id = msDoneId(tripId, key);
    if (done) putRecord({ id: id, type: 'msdone', tripId: tripId, msKey: key, done: true });
    else softDelete(id);
  }

  /* =======================================================================
     4. UI primitives — no alert/confirm/prompt anywhere
     ======================================================================= */
  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function toast(msg, isErr) {
    var host = document.getElementById('toastHost');
    var t = h('div', 'toast' + (isErr ? ' err' : ''), msg);
    host.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, isErr ? 4200 : 2600);
  }

  function showModal(o) {
    var ov = h('div', 'modal-overlay');
    var bx = h('div', 'modal-box');
    bx.appendChild(h('h3', null, o.title));
    if (o.message) bx.appendChild(h('p', null, o.message));
    if (o.build) o.build(bx);
    var row = h('div', 'modal-buttons');
    if (o.cancelText) {
      var c = h('button', 'btn-secondary', o.cancelText);
      c.type = 'button';
      c.addEventListener('click', function () { ov.remove(); });
      row.appendChild(c);
    }
    var ok = h('button', o.danger ? 'btn-danger' : 'btn-primary', o.confirmText || 'OK');
    ok.type = 'button';
    ok.addEventListener('click', function () {
      if (o.onConfirm && o.onConfirm() === false) return;
      ov.remove();
    });
    row.appendChild(ok);
    bx.appendChild(row);
    ov.appendChild(bx);
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    return ov;
  }

  // Small form modal — replaces prompt()
  function showFormModal(opts) {
    var inputs = {};
    showModal({
      title: opts.title,
      message: opts.message,
      confirmText: opts.confirmText || 'Add',
      cancelText: 'Cancel',
      build: function (bx) {
        opts.fields.forEach(function (f, i) {
          var l = h('label', 'field');
          l.style.marginTop = i === 0 ? '16px' : '0';
          l.appendChild(h('span', 'lbl', f.label));
          var inp = document.createElement('input');
          inp.type = f.type || 'text';
          if (f.placeholder) inp.placeholder = f.placeholder;
          if (f.value) inp.value = f.value;
          l.appendChild(inp);
          bx.appendChild(l);
          inputs[f.key] = inp;
        });
      },
      onConfirm: function () {
        var vals = {};
        Object.keys(inputs).forEach(function (k) { vals[k] = inputs[k].value.trim(); });
        return opts.onSubmit(vals);
      }
    });
  }

  /* =======================================================================
     5. Claude API — key from Settings, never hardcoded.
        Every AI feature is additive; the app is fully usable without a key.
     ======================================================================= */
  function hasKey() { return !!Store.get('anthropic_key'); }

  function askClaude(prompt, opts) {
    opts = opts || {};
    var key = Store.get('anthropic_key');
    if (!key) return Promise.reject(new Error('NO_KEY'));
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: opts.maxTokens || 2000,
        system: opts.system || undefined,
        messages: [{ role: 'user', content: prompt }]
      })
    }).then(function (res) {
      if (!res.ok) throw new Error('Claude API error ' + res.status);
      return res.json();
    }).then(function (d) {
      return d.content.filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n');
    });
  }

  function askClaudeJSON(prompt, opts) {
    return askClaude(prompt, opts).then(function (txt) {
      var t = txt.trim();
      t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      var first = Math.min.apply(null, ['[', '{'].map(function (c) {
        var i = t.indexOf(c); return i === -1 ? Infinity : i;
      }));
      if (first !== Infinity && first > 0) t = t.slice(first);
      return JSON.parse(t);
    });
  }

  /* =======================================================================
     6. Intake definitions — 8 essentials, a gate, 2 optional refinements
     ======================================================================= */
  var ESSENTIALS = 8;

  var STEPS = [
    { stage: 'Destination', title: 'Where are we headed?',
      help: 'The place, and whether this is one stop or a few. "No idea yet" is a perfectly good answer.',
      parts: [
        { type: 'destination', key: 'destination' },
        { type: 'shape', key: 'shape', label: 'One stop, or several?',
          help: 'Plenty of trips are really two or three trips stitched together.' }
      ] },

    { stage: 'Destination', title: 'What kind of trip is this?',
      help: 'This decides which booking windows, price rules, and insider traditions I apply to everything else.',
      parts: [
        { type: 'single', key: 'tripType', options: [
          { v: 'cruise', ico: '🚢', label: 'Cruise', sub: 'Booking windows tied to sail date and loyalty tier' },

          { v: 'resort', ico: '🏝️', label: 'Beach / resort', sub: 'All-inclusive or condo stay, low-key pace' },
          { v: 'city', ico: '🌆', label: 'City trip', sub: 'Museums, food, timed-entry attractions' },
          { v: 'roadtrip', ico: '🚗', label: 'Road trip', sub: 'Multi-stop driving, national parks' },
          { v: 'mixed', ico: '🧭', label: 'A mix', sub: 'Combination — a cruise plus land days, say' }
        ] }
      ] },

    { stage: 'Timing', title: 'When are you going?',
      help: 'Exact dates if you have them. If you are flexible I will hunt for the cheapest week in your window.',
      parts: [
        { type: 'dates', key: 'dates' },
        { type: 'multi', key: 'occasion', label: 'Anything special about these dates?',
          help: 'Holidays and celebrations change pricing, crowds, and what is worth planning around.',
          options: [
            { v: 'holiday', ico: '🦃', label: 'Falls on a holiday', sub: 'Thanksgiving, Christmas, spring break…' },
            { v: 'birthday', ico: '🎂', label: 'A birthday or anniversary', sub: 'Noted for freebies and reservations' },
            { v: 'family', ico: '👨‍👩‍👧‍👦', label: 'Meeting up with family', sub: 'Coordinating with other households' },
            { v: 'school', ico: '🎒', label: 'Kids miss school days', sub: 'Worth checking the absence policy' },
            { v: 'none', ico: '—', label: 'Nothing special', sub: 'Just a getaway' }

    { stage: 'Your Crew', title: 'Who is traveling?',
      help: 'Ages drive kids-club eligibility, excursion minimums, ride heights, and when adult-only dining is even possible.',
      parts: [
        { type: 'travelers', key: 'travelers' },
        { type: 'single', key: 'pace', label: 'What pace suits this crew?',
          help: 'So I do not over-schedule a 9-year-old or under-plan a 12-year-old.',
          options: [
            { v: 'packed', ico: '⚡', label: 'Pack it in', sub: 'Maximize every day, we rest at home' },
            { v: 'balanced', ico: '⚖️', label: 'Balanced', sub: 'One or two anchors a day, room to wander' },
            { v: 'slow', ico: '🌴', label: 'Slow and easy', sub: 'Pool time is the point' }

          { v: 'fly', ico: '✈️', label: 'Flying', sub: 'I will time booking to the fare sweet spot' },
          { v: 'drive', ico: '🚗', label: 'Driving', sub: 'Route, overnight stops, fuel budget' },
          { v: 'either', ico: '🤷', label: 'Whichever is cheaper', sub: 'I will compare drive time against airfare' },
          { v: 'booked', ico: '✅', label: 'Already booked', sub: 'Skip it' }

        { type: 'multi', key: 'ground', label: 'Once you land',
          help: 'Pick everything you would consider and I will price them against each other for your party size.',

            { v: 'rental', ico: '🚙', label: 'Rental car', sub: 'Freedom to roam — watch port and resort parking fees' },

            { v: 'transfer', ico: '🚌', label: 'Cruise or resort transfer', sub: 'Disney bus, hotel shuttle — easiest, rarely cheapest' },

            { v: 'transit', ico: '🚇', label: 'Public transit', sub: 'Cheapest by far in the right city' },
            { v: 'walk', ico: '🚶', label: 'Mostly walking', sub: 'Free, if you pick lodging location carefully' },
            { v: 'advise', ico: '🧭', label: 'Compare them for me', sub: 'I will run the numbers for each leg' }
          ] }
      ] },

    { stage: 'Lodging', title: 'Where are you staying?',
      help: 'No assumptions — a rental often wins for four people, and cruise cabins follow their own rules.',
      parts: [
        { type: 'single', key: 'lodging', options: [
          { v: 'airbnb', ico: '🏠', label: 'Airbnb / vacation rental', sub: 'Kitchen, space, usually cheaper for four' },
          { v: 'hotel', ico: '🏨', label: 'Hotel', sub: 'Points, status upgrades, free-cancellation rebooking' },
          { v: 'resort', ico: '🏖️', label: 'Resort or on-property', sub: 'Package perks and early booking windows' },
          { v: 'cabin', ico: '🛳️', label: 'Cruise cabin only', sub: 'Plus any pre or post-cruise nights' },
          { v: 'family', ico: '🛋️', label: 'With family or friends', sub: 'No lodging cost' },
          { v: 'undecided', ico: '❓', label: 'Not sure yet', sub: 'Help me compare' }
        ] },
        { type: 'single', key: 'flanking', label: 'Days before and after the main event?',
          help: 'Extra days protect against travel delays and are usually where the best local finds live.',
          options: [
            { v: 'both', ico: '📆', label: 'Both ends', sub: 'Arrive early, leave late' },
            { v: 'before', ico: '🌅', label: 'A day before only', sub: 'Buffer against delays' },
            { v: 'after', ico: '🌇', label: 'A day after only', sub: 'Decompress before flying home' },
            { v: 'none', ico: '⏱️', label: 'Tight — in and out', sub: 'I will flag the risk if this is a cruise' },
            { v: 'unsure', ico: '❓', label: 'Advise me', sub: 'Recommend based on my itinerary' }
          ] },
        { type: 'multi', key: 'afterVibe', label: 'What should those days look like?',
          options: [
            { v: 'explore', ico: '🗺️', label: 'Explore the area properly', sub: 'Treat the gateway city as its own destination' },

    { stage: 'The Money', title: 'What is the budget?',

          help: 'Everything you do not pick here gets optimized hard for value.',
          options: [
            { v: 'lodging', ico: '🛏️', label: 'Where we stay', sub: 'Space and comfort matter most' },

            { v: 'flights', ico: '💺', label: 'Comfortable flights', sub: 'Nonstop, seats together, decent times' },

    { stage: 'Your Perks', title: 'What memberships or status do you have?',
      help: 'This is where the real savings and early booking windows come from. Set your exact tier — I will never guess it.',
      parts: [ { type: 'memberships', key: 'memberships' } ] },

    { stage: 'Almost There', type: 'gate', title: 'That is enough to build a plan',
      help: 'Last thing: tell me what is already handled so I do not put it on your to-do list. Everything left unchecked becomes a dated milestone.',
      parts: [
        { type: 'multi', key: 'booked', options: [
          { v: 'main', ico: '🎫', label: 'The main event', sub: 'Cruise, park tickets, the core reservation' },
          { v: 'transport', ico: '✈️', label: 'Flights or transport', sub: '' },
          { v: 'lodging', ico: '🏠', label: 'Lodging', sub: '' },
          { v: 'activities', ico: '🎭', label: 'Activities or excursions', sub: '' },
          { v: 'dining', ico: '🍴', label: 'Dining reservations', sub: '' },
          { v: 'nothing', ico: '🆕', label: 'Nothing yet — starting fresh', sub: 'I will build the whole plan' }

    { stage: 'Refinements', optional: true, title: 'The insider stuff',
      help: 'Traditions regulars know about and first-timers miss entirely. Most need prep weeks ahead — say yes and I add it to your timeline.',

      help: 'Must-dos, hard nos, what the kids are into right now, dietary needs, motion sickness — the details that make a plan actually fit your family.',
      parts: [ { type: 'notes', key: 'interests' } ] }
  ];

  var GATE = ESSENTIALS, BRIEF = STEPS.length, PLAN = STEPS.length + 1;

  var LOYALTY = [
    { id: 'castaway', ico: '🚢', name: 'Disney Castaway Club', tiers: ['Select tier', 'Silver', 'Gold', 'Platinum', 'Pearl'] },
    { id: 'southwest', ico: '✈️', name: 'Southwest Rapid Rewards', tiers: ['Select tier', 'Member', 'A-List', 'A-List Preferred', 'Companion Pass'] },

    { id: 'card', ico: '💳', name: 'Travel credit card perks', tiers: ['Select tier', 'Amex Platinum', 'Chase Sapphire', 'Capital One Venture', 'Other'] }
  ];
  var LOYALTY_NAME = {};
  LOYALTY.forEach(function (p) { LOYALTY_NAME[p.id] = p.name; });

  /* =======================================================================
     7. Deep-cuts library — insider traditions, adapts to trip type
     ======================================================================= */
  var CUTS = {
    cruise: [
      { id: 'fish', ico: '🎣', name: 'Fish extenders',
        desc: 'A guest-run gift exchange. Families sign up through the sailing’s Facebook group, get assigned a handful of staterooms, and tuck small handmade or bought gifts into a fabric organizer hanging outside each door. For a lot of families it ends up being the best part of the cruise.',
        prep: 'Join the group and claim a spot 3–4 months out; groups close early. Budget a few dollars per gift and expect a craft project.' },
      { id: 'pins', ico: '📌', name: 'Pin trading',
        desc: 'Trade pins with crew anywhere on the ship. Crew must trade if you ask and they have one. A bulk lot bought ahead costs a fraction of onboard prices.',
        prep: 'Buy a bulk lot online 4–6 weeks ahead — onboard pins run roughly ten times the price.' },
      { id: 'door', ico: '🚪', name: 'Stateroom door decorating',
        desc: 'Magnetic decorations on your cabin door. The hallways turn into a gallery and kids hunt for their favorites.',
        prep: 'Order magnets about 3 weeks out. Must be magnetic, never adhesive.' },
      { id: 'pirate', ico: '🏴‍☠️', name: 'Pirate night costumes',
        desc: 'One night is a pirate deck party with fireworks at sea. Costumes bought at home cost a quarter of the onboard shop.',
        prep: 'Pack from home — a real money-saver.' },
      { id: 'wine', ico: '🍷', name: 'Bring your own wine',
        desc: 'Adults may carry aboard a limited amount of wine or beer at embarkation and each port. Corkage is far less than buying the same bottle at the bar.',
        prep: 'Carry-on only, never checked. Confirm the current per-adult limit.' },
      { id: 'palo', ico: '🥂', name: 'Adults-only dining',
        desc: 'The one reservation regulars call non-negotiable — and it books out within minutes of your window opening. Kids clubs cover the same hours.',
        prep: 'Book the minute your booking window opens, at midnight Eastern.' },
      { id: 'servers', ico: '🍽️', name: 'Request your servers back',
        desc: 'Rotational dining means your serving team follows you between restaurants. If you loved a team on a past sailing you can request them again.',
        prep: 'Email special services about 2 weeks before sailing.' }
    ],

  function exportData() {
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'voyage-concierge-' + AZ.today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Exported.');
    } catch (e) { toast('Export failed on this browser.', true); }
  }

  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var incoming = JSON.parse(rd.result);
          if (!incoming || !incoming.records) throw new Error('bad file');
          // merge: newest updatedAt wins, same rule a future sync would use
          Object.keys(incoming.records).forEach(function (id) {
            var rec = incoming.records[id], cur = data.records[id];
            if (!cur || (rec.updatedAt || 0) > (cur.updatedAt || 0)) data.records[id] = rec;
          });
          saveData();
          toast('Imported and merged.');
          go('trips', null);
        } catch (e) { toast('That file could not be read.', true); }
      };
      rd.readAsText(f);
    });
    inp.click();
  }

  var saveTimer = null;

    var trip = currentTrip();
    if (!trip) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { putRecord(trip); }, 250);
  }

  function labelFor(key, val) {
    for (var i = 0; i < STEPS.length; i++) {
      var parts = STEPS[i].parts || [];
      for (var j = 0; j < parts.length; j++) {
        if (parts[j].key === key && parts[j].options) {
          var o = parts[j].options.filter(function (x) { return x.v === val; })[0];
          if (o) return o.label;
        }
      }
    }
    return val;
  }

  function optionButton(o, selected) {
    var b = h('button', 'opt' + (selected ? ' sel' : ''));

    b.appendChild(main);

  function intakeNextLabel() {
    if (app.view === 'brief') return 'Generate my plan';
    var s = STEPS[app.step];
    if (!s) return 'Continue';
    if (s.type === 'gate') return 'Build my plan';
    if (app.step === STEPS.length - 1) return 'Build my plan';
    return 'Continue';
  }

  function intakeNext() {
    if (app.view === 'brief') {
      var trip = currentTrip();
      if (trip) { trip.status = 'active'; putRecord(trip); }
      go('plan');
      return;
    }
    if (app.step === GATE) { go('brief'); return; }
    if (app.step >= STEPS.length - 1) { go('brief'); return; }
    app.step++;
    render(); window.scrollTo(0, 0);
  }

  function intakeBack() {
    if (app.view === 'brief') { app.step = GATE; go('intake'); return; }
    if (app.step === 0) { go('trips'); return; }
    app.step--;
    render(); window.scrollTo(0, 0);
  }

  function renderIntake() {
    var trip = currentTrip();
    if (!trip) { go('trips', null); return; }
    var a = A(trip);
    var s = STEPS[app.step];
    var fill = document.getElementById('progressFill');
    var stageLabel = document.getElementById('stageLabel');
    var stepLabel = document.getElementById('stepLabel');

    if (app.step < ESSENTIALS) {
      fill.style.width = (app.step / ESSENTIALS * 100) + '%';
      stepLabel.textContent = 'Step ' + (app.step + 1) + ' of ' + ESSENTIALS;
    } else if (s.type === 'gate') {
      fill.style.width = '100%';
      stepLabel.textContent = 'Ready';
    } else {
      fill.style.width = '100%';
      stepLabel.textContent = 'Optional · ' + (app.step - ESSENTIALS) + ' of ' + (STEPS.length - ESSENTIALS - 1);
    }
    stageLabel.textContent = s.stage;

    elMain.appendChild(h('div', 'q-eyebrow', s.stage));
    elMain.appendChild(h('h2', 'q-title serif', s.title));
    elMain.appendChild(h('p', 'q-help', s.help));
    var body = h('div', 'q-body');
    elMain.appendChild(body);

    var solo = s.parts.length === 1;
    s.parts.forEach(function (p, i) {
      if (p.label) body.appendChild(h('div', 'part-label' + (i === 0 ? ' first' : ''), p.label));
      if (p.help) body.appendChild(h('p', 'part-help', p.help));
      renderPart(p, body, solo, trip, a);
    });

    if (s.type === 'gate') {
      var more = optionButton({ v: 'more', ico: '✨', label: 'Two more questions first',
        sub: 'Insider traditions and anything else I should know — makes the plan noticeably sharper' }, false);

  /* =======================================================================
     15. Research (Claude) — additive only, never required
     ======================================================================= */
  function tripContext(trip) {
    var a = A(trip);
    var lines = [];
    lines.push('Destination: ' + (a.destination && a.destination !== 'unsure' ? a.destination : 'undecided'));
    if (a.shape === 'multi' && (a.segments || []).length) {
      lines.push('Stops: ' + a.segments.map(function (s) { return (s.place || '?') + ' for ' + (s.nights || 0) + ' nights'; }).join('; '));
    }
    lines.push('Trip type: ' + (a.tripType || 'unspecified'));
    lines.push('Dates: ' + (a.startDate || '?') + ' to ' + (a.endDate || '?'));
    lines.push('Travelers: ' + (a.travelers || []).join(', '));
    if ((a.occasion || []).length) lines.push('Occasion notes: ' + a.occasion.join(', '));
    lines.push('Getting there: ' + (a.transport || 'unspecified') + '; ground options considered: ' + ((a.ground || []).join(', ') || 'none specified'));
    lines.push('Lodging: ' + (a.lodging || 'unspecified'));
    lines.push('Extra days before/after: ' + (a.flanking || 'unspecified') + '; desired flavor: ' + ((a.afterVibe || []).join(', ') || 'unspecified'));
    if (a.budgetTotal) lines.push('Budget: $' + a.budgetTotal + (a.budgetMax ? ' target, $' + a.budgetMax + ' ceiling' : ''));
    if ((a.splurge || []).length) lines.push('Willing to splurge on: ' + a.splurge.join(', '));
    var mem = Object.keys(a.memberships || {}).map(function (k) { return (LOYALTY_NAME[k] || k) + ' ' + a.memberships[k]; });
    if (mem.length) lines.push('Memberships and status: ' + mem.join('; '));
    if ((a.booked || []).length) lines.push('Already booked: ' + a.booked.join(', '));
    lines.push('Pace: ' + (a.pace || 'unspecified'));
    if (a.interests) lines.push('Family notes: ' + a.interests);
    return lines.join('\n');
  }

  var RESEARCH_SYSTEM = 'You are a meticulous family travel advisor. You give specific, verifiable, practical advice — named venues, real booking windows, honest dollar ranges. You never invent events you are not confident actually run. If unsure whether something happens on the given dates, describe it as typical for the season and say so. Respond with ONLY valid JSON, no markdown fences, no commentary.';

  function researchTrip(trip, btn) {
    var a = A(trip);
    if (!a.startDate) { toast('Add dates first.', true); return; }
    setBusy(btn, true, 'Researching…');
    var prompt = [
      'Plan research for this family trip.',
      '',
      tripContext(trip),
      '',
      'Return JSON with this exact shape:',
      '{',
      '  "finds": [ { "date": "YYYY-MM-DD", "title": "", "meta": "short line: where / cost / booking need", "desc": "2-3 sentences on why it fits this family and any timing trick" } ],',
      '  "cuts": [ { "id": "short_slug", "ico": "one emoji", "name": "", "desc": "what it is and why regulars love it", "prep": "what to do and how far ahead" } ],',
      '  "tradeoffs": [ { "title": "", "q": "", "save": {"opt":"","cost":"","why":""}, "up": {"opt":"","cost":"","why":""}, "rec": "", "pick": "save|up" } ],',
      '  "milestones": [ { "title": "", "daysBefore": 45, "tip": "" } ],',
      '  "notes": [ { "title": "", "body": "" } ]',
      '}',
      '',
      'Rules:',
      '- finds: 3-6 things genuinely happening or seasonally typical during the exact dates, at or near the destination. Include the days before and after the main event. Dates must fall within a few days of the trip window.',
      '- cuts: up to 4 insider traditions specific to this ship, park, or city that a first-timer would miss. Skip generic advice.',
      '- tradeoffs: up to 3 decisions with realistic current dollar figures for this destination and party size. Be honest about the downside of each side.',
      '- milestones: up to 4 dated actions not already obvious (event ticket releases, permit lotteries, seasonal opening dates). daysBefore is days before the start date.',
      '- notes: up to 3 money or timing insights specific to this destination and these dates.'
    ].join('\n');

    askClaudeJSON(prompt, { system: RESEARCH_SYSTEM, maxTokens: 4000 }).then(function (out) {
      trip.ai = trip.ai || {};
      trip.ai.finds = Array.isArray(out.finds) ? out.finds.slice(0, 8) : [];
      trip.ai.cuts = Array.isArray(out.cuts) ? out.cuts.slice(0, 6) : [];
      trip.ai.tradeoffs = Array.isArray(out.tradeoffs) ? out.tradeoffs.slice(0, 4) : [];
      trip.ai.milestones = Array.isArray(out.milestones) ? out.milestones.slice(0, 6) : [];
      trip.ai.notes = Array.isArray(out.notes) ? out.notes.slice(0, 4) : [];
      trip.ai.researchedAt = AZ.today();
      putRecord(trip);
      toast('Research added.');
      render();
    }).catch(function (e) {
      setBusy(btn, false);
      if (e && e.message === 'NO_KEY') { toast('Add a Claude key in Settings first.', true); return; }
      toast('Research failed — ' + (e && e.message ? e.message : 'try again'), true);
    });
  }

  function suggestDestinations(trip) {
    var a = A(trip);
    var ov = showModal({ title: 'Thinking…', message: 'Looking for destinations that fit your crew, dates and budget.', confirmText: 'Cancel' });
    var prompt = [
      'Suggest three destinations for this family trip.',
      '',
      tripContext(trip),
      '',
      'Return JSON: {"options":[{"place":"City, State/Country","why":"2 sentences on why it fits this family","when":"best timing note for their dates","cost":"rough total range for the party"}]}',
      'Be specific and realistic. Vary the three meaningfully in cost and style.'
    ].join('\n');

    askClaudeJSON(prompt, { system: RESEARCH_SYSTEM, maxTokens: 1500 }).then(function (out) {
      ov.remove();
      var opts = (out && out.options) || [];
      if (!opts.length) { toast('No suggestions came back — try again.', true); return; }
      showModal({
        title: 'Three ideas',
        confirmText: 'Close',
        build: function (bx) {
          opts.forEach(function (o) {
            var card = h('div', 'tip-card');
            card.style.marginTop = '12px';
            card.appendChild(h('h4', null, o.place || 'Option'));
            card.appendChild(h('p', null, [o.why, o.when, o.cost].filter(Boolean).join(' ')));
            var pick = h('button', 'btn-sm primary', 'Use this');
            pick.type = 'button';
            pick.style.marginTop = '10px';
            pick.addEventListener('click', function () {
              a.destination = o.place;
              putRecord(trip);
              document.querySelectorAll('.modal-overlay').forEach(function (m) { m.remove(); });
              toast('Destination set.');
              render();
            });
            card.appendChild(pick);
            bx.appendChild(card);
          });
        }
      });
    }).catch(function (e) {
      ov.remove();
      toast('Could not get suggestions — ' + (e && e.message ? e.message : 'try again'), true);
    });
  }

  function setBusy(btn, busy, label) {
    if (!btn) return;
    if (busy) {
      btn.disabled = true;
      clear(btn);
      btn.appendChild(h('span', 'spinner'));
      btn.appendChild(document.createTextNode(label || 'Working…'));
    } else {
      btn.disabled = false;
    }
  }

  /* =======================================================================
     16. Boot
     ======================================================================= */
  window.addEventListener('beforeunload', function () {
    var trip = currentTrip();
    if (trip) putRecord(trip);
  });

  render();
})();
</script>
</body>
</html>
